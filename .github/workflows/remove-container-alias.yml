name: Remove unprefixed container alias

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Unprefixed version alias to remove (e.g. 0.11.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: remove-container-alias
  cancel-in-progress: false

jobs:
  remove-alias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only the unprefixed alias and verify retained tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          REMOVE_VERSION: ${{ inputs.version }}
        run: python3 scripts/remove-container-alias.py
