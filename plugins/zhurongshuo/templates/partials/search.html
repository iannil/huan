<!-- Search Dialog -->
<div id="search-dialog" class="search-dialog-overlay" style="display: none;">
    <div class="search-dialog">
        <div class="search-header">
            <input type="text"
                   id="search-input"
                   class="search-input"
                   placeholder="{{ i18n "search_placeholder" }}"
                   autocomplete="off"
                   spellcheck="false">
            <button id="search-close" class="search-close-btn" aria-label="{{ i18n "search_close" }}">
                <i class="ri-close-line"></i>
            </button>
        </div>
        <div class="search-status" id="search-status" style="display: none;"></div>
        <div id="search-results" class="search-results"></div>
        <div class="search-footer">
            <span class="search-shortcut">
                <kbd>↑</kbd> <kbd>↓</kbd> {{ i18n "search_navigate" }}
            </span>
            <span class="search-shortcut">
                <kbd>Enter</kbd> {{ i18n "search_open" }}
            </span>
            <span class="search-shortcut">
                <kbd>ESC</kbd> {{ i18n "search_shortcut_esc" }}
            </span>
        </div>
    </div>
</div>
