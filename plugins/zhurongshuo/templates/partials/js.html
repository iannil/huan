{{ if .Site.Params.googleAnalytics }}
<!-- Google Analytics - Optimized Lazy Loading -->
<script>
  window.GA_MEASUREMENT_ID = '{{ .Site.Params.googleAnalytics }}';
  window.GA_CONFIG = {
    enableReadingTime: true,
    enableScrollDepth: true,
    enableOutboundLinks: true,
    enableDownloads: true,
    lazyLoadTimeout: 3000
  };
  window.GA_PAGE_CONTEXT = {
    path: '{{ .RelPermalink }}',
    title: '{{ .Title }}',
    section: '{{ .Section }}'
  };
</script>
<script defer src="/theme/zhurongshuo/js/ga-optimizer.js"></script>
<script defer src="/theme/zhurongshuo/js/ga-events.js"></script>
{{ end }}
